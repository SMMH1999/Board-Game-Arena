name: Splendor strategy benchmark

on:
  push:
    branches: [simulator]
  pull_request:
    branches: [main]
    paths:
      - "simulator/**"
      - "splendor-reader/advice.js"
      - "splendor-reader/forecast.js"
      - ".github/workflows/splendor-strategy.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  strategy-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Verify simulator rules and gate
        run: python -m unittest discover -s simulator/tests -v
      - name: Require the browser strategy to pass 100 matches
        run: python -m simulator --games 100 --workers 2 --seed 42 --require-pass extension
      - name: Upload match reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v6
        with:
          name: splendor-strategy-report
          path: simulator/reports/latest/
          if-no-files-found: ignore
